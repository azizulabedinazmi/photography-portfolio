backend:
  name: git-gateway
  branch: main

media_folder: "dist/assets/Photography"
public_folder: "dist/assets/Photography"

site_url: "https://azmi-gallery.netlify.app"
display_url: "https://azmi-gallery.netlify.app"
logo_url: "https://azmi-gallery.netlify.app/dist/assets/Logo.png"

collections:
  - name: "gallery_data"
    label: "Master Gallery Data"
    files:
      - name: "curated_photos"
        label: "Curated Photos & Artworks (55+ Items)"
        file: "dist/gallery-data.json"
        description: "Add, edit, reorder, or update your portfolio photographs and PicsArt digital artworks."
        fields:
          - label: "Photos & Artworks List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} [{{fields.category}}]"
            fields:
              - { label: "Unique ID", name: "id", widget: "string", hint: "e.g. photo-golden-hour or picsart-mirage" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image Source (Upload local image, PicsArt URL, or Google Drive link/ID)", name: "src", widget: "image" }
              - { label: "Category", name: "category", widget: "select", options: [
                  { label: "Portraits", value: "portraits" },
                  { label: "Events & Documentary", value: "events" },
                  { label: "Nature & Details", value: "nature" },
                  { label: "🎨 PicsArt Digital Art", value: "art" }
                ], default: "portraits" }
              - { label: "Camera Gear / Medium", name: "camera", widget: "string", default: "Canon EOS · 50mm f/1.8 · 1/640s · ISO 100" }
              - { label: "Collection / Series Name", name: "location", widget: "string", default: "Fine Art Series" }
              - { label: "Search Tags (comma separated)", name: "tags", widget: "string", required: false }
              - { label: "Is Curated Series?", name: "isSeries", widget: "boolean", default: false, required: false }
              - { label: "Series Count", name: "seriesCount", widget: "number", default: 1, required: false }
              - { label: "Series Extra Photos", name: "seriesExtra", widget: "list", field: { label: "Extra Image", widget: "image" }, required: false }
