backend:
  name: git-gateway
  branch: main

# New photo originals: upload them in the Studio (Upload tab) instead. That sends the full-size
# file to private Cloudflare R2. Files uploaded here are committed to GitHub.
media_folder: "dist/assets/Photography"
public_folder: "dist/assets/Photography"

site_url: "https://azmi.is-cool.dev"
display_url: "https://azmi.is-cool.dev"
logo_url: "https://azmi.is-cool.dev/dist/assets/Logo.png"

collections:
  - name: "gallery_data"
    label: "Gallery"
    files:
      - name: "curated_photos"
        label: "Photos & Artworks"
        file: "dist/gallery-data.json"
        description: "Edit titles, alt text, tags and settings. To reorder, hide or feature photos quickly, or to upload new ones, use the Studio (top bar)."
        fields:
          - label: "Photos & Artworks"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} [{{fields.category}}]"
            # Every field the site uses is listed here, so saving in the CMS never drops data
            # such as an artwork's Replay steps.
            fields:
              - { label: "Unique ID", name: "id", widget: "string", hint: "e.g. photo-golden-hour or art-mirage" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Alt text for Google (who / what is in the photo)", name: "alt", widget: "string", required: false, hint: "Describe who/what is in the photo, e.g. Hafsa Prapti — outdoor portrait. Searching that name on Google can then find this photo. Leave your own name out so a search for you doesn't list every photo." }
              - { label: "Image", name: "src", widget: "image", hint: "New photos: upload them in Studio → Upload (private R2 storage) instead of here." }
              - { label: "Category", name: "category", widget: "select", options: [
                  { label: "Portraits", value: "portraits" },
                  { label: "Events & Documentary", value: "events" },
                  { label: "Nature & Details", value: "nature" },
                  { label: "🎨 Digital Art", value: "art" }
                ], default: "portraits" }
              - { label: "Hidden (keep it, but don't show it on the site)", name: "hidden", widget: "boolean", default: false, required: false }
              - { label: "Featured (show in the homepage filmstrip)", name: "featured", widget: "boolean", default: false, required: false, hint: "If no photo is featured, the filmstrip shows the first 18." }
              - { label: "Camera line (optional)", name: "camera", widget: "string", required: false, hint: "Leave empty: the real camera settings are read from the photo's EXIF when the site builds." }
              - { label: "Collection / Series Name", name: "location", widget: "string", required: false }
              - { label: "Search Tags (comma separated)", name: "tags", widget: "string", required: false }
              - { label: "Is a Series?", name: "isSeries", widget: "boolean", default: false, required: false }
              - { label: "Series group", name: "seriesGroup", widget: "string", required: false }
              - { label: "Series Count", name: "seriesCount", widget: "number", required: false }
              - { label: "Series Extra Photos", name: "seriesExtra", widget: "list", field: { label: "Extra Image", name: "image", widget: "image" }, required: false }
              - { label: "Art: PicsArt post ID", name: "postId", widget: "string", required: false, hint: "Filled by npm run sync-art" }
              - label: "Art: edit details"
                name: "editDetails"
                widget: "object"
                required: false
                collapsed: true
                fields:
                  - { label: "Canvas size", name: "canvas", widget: "string", required: false }
                  - { label: "Made on", name: "made", widget: "string", required: false }
                  - { label: "Tools", name: "tools", widget: "list", required: false }
                  - { label: "Filters", name: "filters", widget: "list", required: false }
              - label: "Art: Replay steps"
                name: "replay"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.type}}"
                fields:
                  - { label: "Step type", name: "type", widget: "string" }
                  - { label: "Image URL", name: "src", widget: "string" }
