<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Azizul Abedin Azmi Photography & Art</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../dist/assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../dist/assets/favicon-32x32.png" />
  
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  
  <style>
    /* Custom Styling for Top Bar & Branding */
    #studio-companion-banner {
      background: #111827;
      color: #f3f4f6;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      border-bottom: 1px solid #374151;
      position: sticky;
      top: 0;
      z-index: 99999;
    }
    #studio-companion-banner a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.12);
      transition: background 0.2s;
    }
    #studio-companion-banner a:hover {
      background: rgba(251, 191, 36, 0.25);
    }
  </style>
</head>
<body>
  <!-- Companion Switcher Banner -->
  <div id="studio-companion-banner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-weight: 700; color: #fff;">📸 Azmi Portfolio CMS</span>
      <span style="color: #9ca3af;">·</span>
      <span style="color: #9ca3af;">Decap CMS (Git-Gateway)</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="/admin/studio">
        <span>⚡ Open Studio (Dashboard, Reorder, Hide/Feature, Upload to R2) →</span>
      </a>
      <a href="../index.html" style="color: #9ca3af; background: rgba(255, 255, 255, 0.05);" target="_blank">
        <span>View Live Site ↗</span>
      </a>
    </div>
  </div>

  <!-- Include Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
