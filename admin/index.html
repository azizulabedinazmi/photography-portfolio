<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="shell">
  <header class="topbar"><div><span class="eyebrow">AZMI GALLERY</span><h1>Content studio</h1></div><button id="logout" class="ghost hidden">Log out</button></header>
  <section id="loginCard" class="card narrow"><h2>Admin sign in</h2><p>Manage portfolio images and stories stored securely in Netlify Blobs.</p><form id="loginForm"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><p id="loginError" class="error"></p></section>
  <section id="studio" class="hidden">
    <div id="stats" class="stats"></div>
    <nav class="tabs"><button class="tab active" data-tab="photosTab">Photos</button><button class="tab" data-tab="storiesTab">Stories</button></nav>
    <section id="photosTab" class="tab-panel"><div class="toolbar"><div><h2>Photo library</h2><p class="muted">Edit, feature, publish, reorder, or remove work.</p></div><button id="newPhoto">New photo</button></div><div class="filters"><input id="photoSearch" placeholder="Search photos"><select id="photoCategory"><option value="">All categories</option><option>Photography</option><option>Portraits</option><option>Art</option><option>Commercial</option></select><select id="photoStatus"><option value="">All status</option><option value="true">Published</option><option value="false">Drafts</option></select></div><div id="photos" class="photo-list"></div></section>
    <section id="storiesTab" class="tab-panel hidden"><div class="toolbar"><div><h2>Stories</h2><p class="muted">Publish behind-the-scenes notes and longer stories.</p></div><button id="newStory">New story</button></div><div class="filters"><input id="storySearch" placeholder="Search stories"><select id="storyStatus"><option value="">All status</option><option value="published">Published</option><option value="draft">Drafts</option></select></div><div id="stories" class="story-list"></div></section>
  </section>
</main>
<dialog id="photoDialog" class="modal"><form id="photoForm" method="dialog"><div class="modal-head"><h2 id="photoDialogTitle">New photo</h2><button type="button" class="icon" data-close="photoDialog">×</button></div><input id="photoId" type="hidden"><input id="storagePath" type="hidden"><label>Image<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Title<input id="title" required></label><label>Alt text<input id="altText" required></label><label>Category<select id="category"><option>Photography</option><option>Portraits</option><option>Art</option><option>Commercial</option></select></label><label>Description<textarea id="description"></textarea></label><label class="check"><input id="published" type="checkbox" checked> Published</label><label class="check"><input id="featured" type="checkbox"> Featured</label><label>Display order<input id="sortOrder" type="number" min="0" value="0"></label><button id="photoSubmit">Save photo</button><p id="photoStatus" class="status"></p></form></dialog>
<dialog id="storyDialog" class="modal"><form id="storyForm" method="dialog"><div class="modal-head"><h2 id="storyDialogTitle">New story</h2><button type="button" class="icon" data-close="storyDialog">×</button></div><input id="storyId" type="hidden"><label>Title<input id="storyTitle" required></label><label>Excerpt<textarea id="excerpt"></textarea></label><label>Story content <small>Markdown supported</small><textarea id="bodyMarkdown" rows="14" required></textarea></label><label>Cover image URL<input id="coverImagePath" placeholder="optional"></label><label>Status<select id="storyState"><option value="draft">Draft</option><option value="published">Published</option></select></label><button>Save story</button><p id="storyStatus" class="status"></p></form></dialog>
<script src="admin.js"></script></body></html>
