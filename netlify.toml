[build]
  command = "node scripts/build-images.js && node scripts/build-seo.js"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Keep admin and client proofing pages out of search engines
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/client/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Old Netlify address -> custom domain (keeps old links and Google results working)
[[redirects]]
  from = "https://azmi-gallery.netlify.app/*"
  to = "https://azmi.is-cool.dev/:splat"
  status = 301
  force = true

# Netlify Identity & Decap CMS Single-Page App rule
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Client proofing gallery links (/client/<session-code>)
[[redirects]]
  from = "/client/:slug"
  to = "/client/index.html?session=:slug"
  status = 200

