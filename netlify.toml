[build]
  command = "echo 'Static site: ready'"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify Identity & Decap CMS Single-Page App rule
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Client Proofing Room Pretty URLs (/client/sarah-session)
[[redirects]]
  from = "/client/:slug"
  to = "/client/index.html?session=:slug"
  status = 200
